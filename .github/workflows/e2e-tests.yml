name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name to probe for service images'
        required: true
        type: string
    outputs:
      report-url:
        description: 'URL to the deployed Playwright HTML report'
        value: ${{ jobs.deploy-report.outputs.report-url }}

jobs:
  # Single-suite gate. This mirrors the tests repository's `npm test` chain,
  # with reseeding run from the workspace checkout because database-reseed.sh
  # needs access to Docker and the stack scripts.
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: DEFRA/trade-imports-animals-workspace
          # Workspace PRs must exercise their own stack changes; callers via
          # workflow_call surface the caller's event name, so they get main
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - name: Resolve branch tag
        id: branch-tag
        run: |
          raw="${{ inputs.branch || github.head_ref || github.ref_name }}"
          tag="${raw//\//-}"
          tag="$(printf '%s' "$tag" | tr -cd 'a-zA-Z0-9_.-')"
          tag="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          while [[ "$tag" == [.-]* ]]; do tag="${tag:1}"; done
          tag="${tag:0:128}"
          echo "sanitised=$tag" >> "$GITHUB_OUTPUT"

          if docker manifest inspect "defradigital/trade-imports-animals-tests:${tag}" >/dev/null 2>&1; then
            echo "tests-tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Tests image: branch ($tag)"
          else
            echo "tests-tag=latest" >> "$GITHUB_OUTPUT"
            echo "Tests image: latest (no branch tag)"
          fi

      - name: Start stack
        run: >
          ./scripts/stack/run-stack.sh
          --branch "${{ inputs.branch || github.head_ref || github.ref_name }}"
          --profile database --profile infrastructure --profile servicebus
          --profile stubs --profile backend --profile frontend

      - name: Assert E2E stack
        run: |
          docker run --rm \
            --network host \
            --user root \
            --entrypoint npm \
            defradigital/trade-imports-animals-tests:${{ steps.branch-tag.outputs.tests-tag }} \
            run _assert_stack

      - name: Reseed database
        # STACK_BRANCH keeps the reseed's staged init fixtures on the PR
        # branch — unset, bounce-mongo.sh sparse-fetches the default branch.
        env:
          STACK_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
        run: ./scripts/stack/bounce-mongo.sh

      - name: Run E2E suite
        run: |
          docker run --rm \
            --network host \
            --user root \
            -v ${{ github.workspace }}/artifacts/test-results:/app/test-results \
            -v ${{ github.workspace }}/artifacts/playwright-report:/app/playwright-report \
            --entrypoint npm \
            defradigital/trade-imports-animals-tests:${{ steps.branch-tag.outputs.tests-tag }} \
            run test:docker-compose:ci

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            artifacts/playwright-report/
            artifacts/test-results/
          retention-days: 14

      - name: Capture stack logs
        if: failure()
        run: docker compose -p trade-imports-animals logs --no-color --timestamps > e2e-stack-logs.txt 2>&1 || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e-stack-logs.txt
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose -p trade-imports-animals down

  deploy-report:
    needs: e2e
    # Publish whenever the suite ran, pass or fail — a failed run is exactly
    # when the HTML report is wanted.
    if: always() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      report-url: ${{ steps.url.outputs.report-url }}
    steps:
      - name: Download E2E report
        uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: report/

      - name: Resolve branch tag
        id: branch-tag
        run: |
          raw="${{ inputs.branch || github.head_ref || github.ref_name }}"
          tag="${raw//\//-}"
          tag="$(printf '%s' "$tag" | tr -cd 'a-zA-Z0-9_.-')"
          tag="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          while [[ "$tag" == [.-]* ]]; do tag="${tag:1}"; done
          tag="${tag:0:128}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report/playwright-report
          destination_dir: e2e/${{ steps.branch-tag.outputs.tag }}
          keep_files: true

      - name: Output report URL
        id: url
        run: |
          repo="${{ github.repository }}"
          owner="${repo%%/*}"
          name="${repo##*/}"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          echo "report-url=https://${owner_lc}.github.io/${name}/e2e/${{ steps.branch-tag.outputs.tag }}/" >> "$GITHUB_OUTPUT"
