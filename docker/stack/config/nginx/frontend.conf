# Reproduces the CDP platform nginx-upstreams sidecar in front of the frontend pod.
# Mirrors DEFRA/cdp-nginx-upstreams server.conf.tpl: a 10M default cap on / and a
# 2304M bypass on /upload-and-scan proxying direct to cdp-uploader. Used by
# EUDPA-106 spike to prove the >10 MB upload path locally.

server {
    listen 3000;

    client_max_body_size 10M;

    # Use docker's embedded DNS with a short TTL and re-resolve upstreams
    # at request time (via variable proxy_pass) so a `docker compose up`
    # that recycles the frontend or cdp-uploader container is picked up
    # without needing to restart this sidecar. Without this, nginx caches
    # the upstream IP at worker init and every subsequent request 502s
    # until the sidecar is bounced.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /upload-and-scan {
        client_max_body_size 2304M;
        set $upstream_uploader "http://cdp-uploader:7337";
        proxy_pass $upstream_uploader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        set $upstream_frontend "http://trade-imports-animals-frontend:3000";
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
